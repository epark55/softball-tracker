name: TEST page updater

# Test only. Keeps the test page (/softball-tracker/test/) on its own tournament, found automatically
# (test/pipeline.mjs), and runs a private copy of the score updater on it. Live files are never written:
# it only commits docs/test/ and test/state/, which don't start the live updater.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run discovery now (otherwise every 6 hours)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: test-updater
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Find the tournament
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
        run: node test/pipeline.mjs
      - name: Pull scores with a private copy of the updater
        run: |
          T="$RUNNER_TEMP/t"; mkdir -p "$T/scripts" "$T/docs"
          cp scripts/update.mjs "$T/scripts/"; cp docs/logic.js "$T/docs/"
          cp test/state/tournament.json "$T/tournament.json"
          [ -f docs/test/data.json ] && cp docs/test/data.json "$T/docs/data.json"
          LIVE_PATH="$T/.live.json" node "$T/scripts/update.mjs" || echo "updater failed this time"
          [ -f "$T/docs/data.json" ] && cp "$T/docs/data.json" docs/test/data.json
      - name: Save
        run: |
          git config user.name "score-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/test test/state
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "Test page update"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 7; done
          exit 1
