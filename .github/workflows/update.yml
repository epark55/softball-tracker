name: Update scores

# One long-running job keeps scores fresh (see scripts/loop.sh): it pulls every 3 minutes for
# about 6 hours, then starts its own next run. The timed schedule is only a backup starter in
# case that chain ever breaks; a run that finds the chain already going exits within 2 minutes.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tournament.json", "scripts/**", "docs/logic.js", ".github/workflows/update.yml"]

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Keep scores updated
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/loop.sh
